[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pritunl-toolbox"
version = "0.2.0"
description = "CLI and terminal UI toolbox for Pritunl VPN: who is connected, who owns an IP, search, GeoIP and audits."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
# Floors track the latest releases; exact, hash-pinned versions live in requirements*.lock
dependencies = [
    "click>=8.5.0",
    "maxminddb>=3.2.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "tomli>=2.5.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "responses>=0.26.3",
    "ruff>=0.17.1",
]

[project.scripts]
pritunl-toolbox = "pritunl_toolbox.cli:main"
ptb = "pritunl_toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
